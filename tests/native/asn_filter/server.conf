serverName fixture
user nobody
group nogroup
httpdWorkers 1
mime conf/mime.properties
indexFiles index.html
disableWebAdmin 1
errorlog logs/error.log {
 logLevel INFO
}
virtualhost new.test {
 vhRoot Example/
 configFile conf/vhosts/test.conf
 allowSymbolLink 1
 enableScript 0
 restrained 1
}
listener Default {
 address 127.0.0.1:18080
 secure 0
  map                     new.test new.test
}
listener Default IPv6 {
 address [::1]:18080
 secure 0
  map                     new.test new.test
}

accesslog logs/access.log {
 rollingSize 10M
}
tuning {
 maxConnections 100
 maxSSLConnections 100
}

enableIpGeo 1
geoipdb /usr/local/lsws/conf/ASN-QA.mmdb {
 geoipDBName ASN_DB
 maxMindDBEnv GEOIP_ASN ASN_DB/autonomous_system_number
}

useIpInProxyHeader 0
