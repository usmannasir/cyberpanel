<style>
/* Docker workspace: use the active CyberPanel theme, with scoped layout rules. */

html #main-content .cp-docker-workspace .page-header { padding: 24px; margin: 0 0 24px; text-align: left; border: 1px solid var(--border-color, #e2e8f0); background: var(--bg-secondary, #fff); border-radius: 12px; animation: none; }

html #main-content .cp-docker-workspace :is(.card-title, .section-title) { margin: 0; line-height: 1.5; font-size: 16px; }

 html #main-content .cp-docker-workspace :is(.page-header, .form-section) { padding: 18px; }

 html #main-content .cp-docker-workspace .page-title { font-size: 20px; }

}
</style>
