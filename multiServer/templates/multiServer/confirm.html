<details class="ms-danger">
  <summary>{{ title }}</summary>
  <form method="post" action="{% url 'multiServerNodeControl' %}">
    {% csrf_token %}
    <input type="hidden" name="link_id" value="{{ node.id }}">
    <input type="hidden" name="action" value="{{ action }}">
    <p>{{ notice }}</p>
    {% if not recent %}<div class="ms-fields">
      <label class="ms-field">Current password <input class="form-control" type="password" name="password" autocomplete="current-password" required></label>
      <label class="ms-field">Verification code <input class="form-control" type="text" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required></label>
    </div>{% endif %}
    <label class="ms-check"><input type="checkbox" name="confirm" value="{{ action }}" required> Yes, {{ title|lower }}: {{ node.label }}</label>
    <button class="btn btn-danger btn-sm" type="submit">{{ title }}</button>
  </form>
</details>
