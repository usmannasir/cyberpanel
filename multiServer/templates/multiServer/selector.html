{% load i18n %}{% if ms_server %}
{% if ms_managed %}
<div class="ms-server-selector" ng-non-bindable>
  <span>{% trans "This server" %} · {{ ms_current }}</span>
  <a href="{{ ms_managed.origin }}/multiserver/nodes" rel="noreferrer noopener">{% trans "Return to controller" %}</a>
</div>
{% else %}
<form class="ms-server-selector" method="post" action="{% url 'msSelect' %}" target="_blank" rel="noopener" onsubmit="return this.elements.server.value !== 'local'" ng-non-bindable>
  {% csrf_token %}<input type="hidden" name="page" value="{{ ms_page }}">
  <label for="ms-server-{{ placement }}">{% trans "Server" %}</label>
  <select id="ms-server-{{ placement }}" name="server">
    <option value="local" selected>{% trans "This server" %} · {{ ms_current }}</option>
    {% for node in ms_nodes %}<option value="{{ node.id }}">{{ node.label }}</option>{% endfor %}
  </select>
  <button type="submit" class="btn btn-default">{% trans "Open" %}</button>
</form>
{% endif %}{% endif %}
