name: Sync release branch to Gitee

on:
  push:
    branches:
      - stable
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: gitee-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-release-ref:
    if: github.repository == 'usmannasir/cyberpanel' && github.event_name == 'push' && github.ref_type == 'branch' && github.event.deleted == false
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      accepted: ${{ steps.validate.outputs.accepted }}
    steps:
      - name: Accept only stable and numeric release branches
        id: validate
        shell: bash
        env:
          RELEASE_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_BRANCH" == stable || "$RELEASE_BRANCH" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'accepted=true' >> "$GITHUB_OUTPUT"
          else
            echo 'accepted=false' >> "$GITHUB_OUTPUT"
          fi

  sync-release:
    needs: validate-release-ref
    if: needs.validate-release-ref.outputs.accepted == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the exact pushed commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: false
          persist-credentials: false

      - name: Push only this release ref and verify Gitee
        shell: bash
        timeout-minutes: 5
        env:
          RELEASE_BRANCH: ${{ github.ref_name }}
          EXPECTED_SHA: ${{ github.sha }}
          GITEE_USER: ${{ secrets.GITEE_USER }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GIT_TERMINAL_PROMPT: '0'
          GIT_SSL_NO_VERIFY: 'false'
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == usmannasir/cyberpanel ]] || exit 1
          [[ "$RELEASE_BRANCH" == stable || "$RELEASE_BRANCH" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_SHA" ]] || exit 1
          [[ "$GITEE_USER" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]*$ ]] || exit 1
          [[ -n "$GITEE_TOKEN" ]] || exit 1

          # The token stays in the environment; neither the URL nor this file
          # contains it. A credential-free launcher invokes the 0600 helper.
          umask 077
          auth_dir=$(mktemp -d "$RUNNER_TEMP/gitee-release-auth.XXXXXX")
          trap 'rm -rf -- "$auth_dir"' EXIT
          cat > "$auth_dir/askpass" <<'ASKPASS'
          case "$1" in
            *Username*) printf '%s\n' "$GITEE_USER" ;;
            *Password*) printf '%s\n' "$GITEE_TOKEN" ;;
            *) exit 1 ;;
          esac
          ASKPASS
          chmod 600 "$auth_dir/askpass"
          cat > "$auth_dir/askpass-launcher" <<'LAUNCHER'
          #!/bin/sh
          exec /bin/bash "${0%/*}/askpass" "$@"
          LAUNCHER
          chmod 700 "$auth_dir/askpass-launcher"
          export GIT_ASKPASS="$auth_dir/askpass-launcher"

          remote="https://gitee.com/$GITEE_USER/cyberpanel.git"
          release_ref="refs/heads/$RELEASE_BRANCH"
          tracking_ref="refs/remotes/gitee-release/$RELEASE_BRANCH"
          git_remote() {
            git -c credential.helper= -c http.sslVerify=true \
                -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=30 "$@"
          }
          read_release_ref() {
            local result status
            if result=$(git_remote ls-remote --exit-code --refs "$remote" "$release_ref"); then
              read -r remote_sha remote_ref extra <<< "$result"
              [[ "$remote_sha" =~ ^[0-9a-f]{40}$ && "$remote_ref" == "$release_ref" && -z "${extra:-}" ]] || return 1
            else
              status=$?
              [[ "$status" == 2 ]] || return "$status"
              remote_sha=''
            fi
          }

          read_release_ref
          before_sha="$remote_sha"
          if [[ -n "$before_sha" && "$before_sha" != "$EXPECTED_SHA" ]]; then
            git_remote fetch --no-tags --no-write-fetch-head "$remote" "$release_ref:$tracking_ref"
            # Abort if the remote changed between inspection and fetch, or if
            # updating it would discard any Gitee commit. Never force a ref.
            [[ "$(git rev-parse "$tracking_ref")" == "$before_sha" ]] || exit 1
            git merge-base --is-ancestor "$tracking_ref" HEAD
          fi
          if [[ "$before_sha" != "$EXPECTED_SHA" ]]; then
            git_remote push --no-follow-tags "$remote" "HEAD:$release_ref"
          fi
          read_release_ref
          [[ "$remote_sha" == "$EXPECTED_SHA" ]] || exit 1
          echo "Verified $release_ref at $EXPECTED_SHA on Gitee."
