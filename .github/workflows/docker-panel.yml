name: Docker panel image

on:
  push:
    branches: [v3.0.2-dev]
    tags: ['docker-panel-*']
  workflow_dispatch:
    inputs:
      os_tag:
        description: OS tag (almalinux10 or all)
        required: false
        default: almalinux10

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: almalinux10
            base: almalinux:10
            family: rhel
          - tag: almalinux9
            base: almalinux:9
            family: rhel
          - tag: ubuntu2404
            base: ubuntu:24.04
            family: debian
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/panel/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            master3395/cyberpanel:${{ matrix.tag }}
            master3395/cyberpanel:latest
          build-args: |
            BASE_IMAGE=${{ matrix.base }}
            OS_FAMILY=${{ matrix.family }}
            OS_TAG=${{ matrix.tag }}
