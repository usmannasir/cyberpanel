enableCoreDump 1
sessionTimeout 3600
throttleEnabled 1
throttleMaxFailures 3
throttleBlockWindow 300
throttleMaxBackoff 86400
loginHistoryRetention 30
opsAuditRetainFiles 30
configAutoBackupRetention 90
listener adminListener {
 address 127.0.0.1:17081
 secure 0
}
accessLog $SERVER_ROOT/admin/logs/access.log {
 useServer 0
 rollingSize 10M
}
